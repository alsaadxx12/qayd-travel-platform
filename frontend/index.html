    <!--
      Fonts: 4 weights total.
        IBM Plex Sans Arabic 500/600/700 — the UI text face. Google serves no 800/900
        for this family, so font-extrabold / font-black were always synthesised and
        asking for them would add files without changing a pixel.
        Plus Jakarta Sans 800 — numerals only, and index.css forces weight 800 on
        every rule that selects it, so 600 and 700 were dead weight.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
