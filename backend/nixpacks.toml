providers = ['node']

# ── Runtime variables ──
[variables]
# The address printed inside every statement barcode. It MUST be absolute — a relative
# value makes a phone camera read the code as plain text and offer a web search instead
# of opening the statement. Set it in the Railway variables to the front-end origin:
# PORTAL_BASE_URL = 'https://<front-end-origin>'

# ── System packages: Node.js 20 + Chromium + Arabic fonts via Nix ──
[phases.setup]
nixPkgs = ['nodejs_20', 'chromium', 'noto-fonts-color-emoji', 'fontconfig']

# ── Install: skip Puppeteer download since Nix provides Chromium ──
[phases.install]
cmds = ['PUPPETEER_SKIP_DOWNLOAD=true npm ci --include=dev']

# ── Build: generate Prisma client + compile NestJS ──
[phases.build]
cmds = [
  "npx prisma generate",
  "npx nest build",
]

# ── Start command ──
[start]
cmd = 'node dist/src/main'
